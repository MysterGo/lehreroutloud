<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tools</title>
<meta name="description" content="Werkzeuge für den Schulalltag.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a5cad'/%3E%3Cpath d='M9 22V11l7 6 7-6v11' stroke='%23fff' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap">
<style>
:root{--bg:#eef2f6;--surface:#fff;--ink:#1c2633;--muted:#5e6b7b;--line:#d8dee6;--accent:#2a5cad;--accent-soft:#e4ecf8;--t1:#2a5cad;--t1s:#e4ecf8;--t2:#c2410c;--t2s:#fdecdf;--t3:#15803d;--t3s:#e1f3e6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,-apple-system,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-weight:600;font-size:15px}
.back:hover{color:var(--accent)}
header{margin:18px 0 28px}
h1{margin:0;font-size:clamp(32px,5.5vw,46px);font-weight:800;letter-spacing:-.015em;text-wrap:balance}
header p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.tile{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;color:inherit;text-decoration:none;transition:transform .15s,box-shadow .15s,border-color .15s}
a.tile:hover{transform:translateY(-2px);border-color:#b9c9e4;box-shadow:0 10px 24px -14px rgba(28,38,51,.45)}
.ico{width:52px;height:52px;border-radius:13px;background:var(--cs,var(--accent-soft));display:grid;place-items:center;color:var(--c,var(--accent))}
.tile h2{margin:0;font-size:21px;font-weight:800}
.tile p{margin:0;color:var(--muted);font-size:15px}
.go{margin-top:auto;color:var(--c,var(--accent));font-weight:700;font-size:15px}
.cat{min-height:210px}
.soon{border-style:dashed;background:transparent;justify-content:center;align-items:center;text-align:center;color:var(--muted);min-height:180px}
footer{margin-top:40px;color:var(--muted);font-size:13px}

/* ===== Raum-Ansicht (Bild 1672x941) ===== */
body.room{min-height:100vh;--sw:max(100vw,177.68vh);--sh:max(100vh,56.28vw)}
.roombg{position:fixed;inset:0;z-index:-1;background:#2f4f9a url(../bilder/tools-raum.webp) center/cover no-repeat}
/* .spot: Position in Bild-Pixeln ueber --x --y --w --h */
.spot{position:fixed;left:calc(50vw + var(--sw)*(var(--x)/1672 - .5));top:calc(50vh + var(--sh)*(var(--y)/941 - .5));
  width:calc(var(--sw)*var(--w)/1672);height:calc(var(--sh)*var(--h)/941);container-type:size}
.room .back{position:fixed;left:16px;top:14px;z-index:2;background:rgba(255,255,255,.92);color:#1c2633;padding:7px 14px;border-radius:999px;box-shadow:0 6px 18px -10px rgba(20,35,70,.6)}
.room header{margin:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.room h1{font-size:30cqh;line-height:1}
.room header p{font-size:12cqh;margin-top:5cqh;max-width:86cqw;line-height:1.3}
/* Kachel auf einem Tisch: Tischflaeche bleibt als weisser Rand sichtbar */
.desk{display:flex;align-items:center;gap:5cqw;padding:0 5cqw;margin:5.5cqh 2.2cqw;height:calc(100% - 11cqh);border-radius:5cqh;
  background:#fff;border:1px solid #d6dde6;color:inherit;text-decoration:none;box-shadow:0 1px 0 #e9edf2 inset;transition:transform .15s,box-shadow .15s}
a.desk:hover{transform:translateY(-2px);box-shadow:0 10px 22px -12px rgba(20,35,70,.55)}
.desk .ico{flex:none;width:44cqh;height:44cqh;border-radius:12cqh}
.desk .ico svg{width:26cqh;height:26cqh}
.desk h2{margin:0;font-size:19cqh;line-height:1.1;font-weight:800}
.desk p{margin:2cqh 0 0;font-size:11cqh;line-height:1.25;color:var(--muted)}
.desk .go{display:block;margin-top:5cqh;font-size:12.5cqh}
/* Hochkant / kleine Bildschirme: normale Liste */
@media (max-width:700px),(max-height:480px),(max-aspect-ratio:1/1){
  .spot{position:static;width:auto;height:auto;container-type:normal}
  .room .wrap{padding-top:72px}
  .room header{background:#fff;border:9px solid #23262c;border-radius:10px;padding:18px;margin-bottom:16px}
  .room h1{font-size:34px}.room header p{font-size:15px;margin-top:6px;max-width:none}
  .room .grid{display:grid;gap:12px}
  .desk{margin:0;height:auto;padding:16px;gap:14px;border-radius:14px;border:6px solid #f4f6f9;box-shadow:0 14px 30px -18px rgba(20,35,70,.7)}
  .desk .ico{width:48px;height:48px;border-radius:12px}.desk .ico svg{width:26px;height:26px}
  .desk h2{font-size:20px}.desk p{font-size:14px;margin-top:2px}.desk .go{font-size:15px;margin-top:6px}
}
</style>
</head>
<body class="room">
<div class="roombg" aria-hidden="true"></div>
<div class="wrap">
  <a class="back" href="../">← Startseite</a>
  <!-- Tafel: Innenflaeche im Bild -->
  <header class="spot" style="--x:560;--y:52;--w:550;--h:108">
    <h1>Tools</h1>
    <p>Werkzeuge für den Schulalltag. Läuft direkt im Browser, ohne Anmeldung – alle Daten bleiben auf deinem Gerät.</p>
  </header>
  <main class="grid">
    <!-- Tisch 1: links oben -->
    <div class="spot" style="--x:388;--y:272;--w:358;--h:99">
      <a class="desk" href="https://mystergo.github.io/Sitzplaner/?v=37" style="--c:var(--t1);--cs:var(--t1s)">
        <span class="ico"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="4" y="3" width="16" height="3" rx="1"/><rect x="4" y="10" width="6" height="4" rx="1"/><rect x="14" y="10" width="6" height="4" rx="1"/><rect x="4" y="17" width="6" height="4" rx="1"/><rect x="14" y="17" width="6" height="4" rx="1"/></svg></span>
        <div><h2>Der Sitzplaner</h2><p>Tische stellen, Schüler verteilen, drucken.</p><span class="go">Öffnen →</span></div>
      </a>
    </div>
    <!-- Weitere Tools: Block oben kopieren und Position eines freien Tisches eintragen
         Tisch 2 rechts oben:   --x:916;--y:272;--w:356;--h:99
         Tisch 3 links Mitte:   --x:388;--y:474;--w:358;--h:102
         Tisch 4 rechts Mitte:  --x:918;--y:474;--w:355;--h:102
         Tisch 5 links unten:   --x:388;--y:679;--w:358;--h:105
         Tisch 6 rechts unten:  --x:918;--y:679;--w:356;--h:105 -->
  </main>
</div>
</body>
</html>
